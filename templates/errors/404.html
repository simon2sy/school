{% extends 'base.html' %}
{% load widget_tweaks %}

{% block content %}

{# Page Header #}
<div class="bg-school-navy text-white py-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <nav class="flex items-center justify-center gap-2 text-sm text-blue-300 mb-4" aria-label="Breadcrumb">
            <a href="{% url 'core:home' %}" class="hover:text-white transition-colors">Home</a>
            <span class="text-white">Error</span>
        </nav>
        <h1 class="font-heading font-bold text-4xl lg:text-5xl mb-4">404 - Page Not Found</h1>
        <p class="text-blue-200 max-w-2xl mx-auto">The page you're looking for doesn't exist.</p>
    </div>
</div>

<section class="py-24 bg-gray-50">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <div class="w-64 h-64 mx-auto mb-8 flex items-center justify-center bg-primary-100 rounded-full">
            <svg class="w-32 h-32 text-primary-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>
        <h2 class="font-heading font-bold text-3xl text-gray-900 mb-2">Page Not Found</h2>
        <p class="text-gray-600 text-lg">We couldn't find the page you're looking for. Please check the URL or go back home.</p>
        <div class="mt-6">
            <a href="{% url 'core:home' %}" class="inline-flex items-center gap-2 px-6 py-3 bg-primary-700 hover:bg-primary-800 text-white text-sm font-semibold rounded-xl transition-colors">
                Go Home
            </a>
        </div>
    </div>
</div>

{% endblock %}
