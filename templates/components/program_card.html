{# Usage: {% include 'components/program_card.html' with program=program %} #}
<div class="group bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl border border-gray-100 hover:border-primary-200 transition-all duration-300 flex flex-col">
    {# Image / Icon #}
    <div class="aspect-video bg-gradient-to-br from-primary-50 to-primary-100 overflow-hidden relative">
        {% if program.featured_image %}
        <img src="{{ program.featured_image.url }}"
             alt="{{ program.name }}"
             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
             loading="lazy" />
        {% else %}
        <div class="absolute inset-0 flex items-center justify-center">
            <div class="w-20 h-20 rounded-2xl bg-primary-700/10 flex items-center justify-center">
                <svg class="w-10 h-10 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>
            </div>
        </div>
        {% endif %}
        {% if program.duration %}
        <div class="absolute top-3 right-3 px-2.5 py-1 bg-primary-700 text-white text-xs font-semibold rounded-full">
            {{ program.duration }}
        </div>
        {% endif %}
    </div>
    {# Content #}
    <div class="p-6 flex flex-col flex-1">
        <h3 class="font-heading font-bold text-gray-900 text-lg mb-2 group-hover:text-primary-700 transition-colors">
            {{ program.name }}
        </h3>
        <p class="text-sm text-gray-500 leading-relaxed mb-4 flex-1">
            {{ program.short_description }}
        </p>
        <a href="{{ program.get_absolute_url }}"
           class="inline-flex items-center gap-2 px-4 py-2.5 bg-primary-50 hover:bg-primary-700 text-primary-700 hover:text-white text-sm font-semibold rounded-xl transition-all duration-200 self-start">
            Learn More
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </a>
    </div>
</div>
