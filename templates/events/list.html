{% extends 'base.html' %}
{% load widget_tweaks %}

{% block content %}

{# Events Section #}
<section class="py-16 bg-school-navy">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-12">
            <h2 class="font-heading font-bold text-4xl lg:text-5xl text-white mb-4">Upcoming Events</h2>
            <p class="text-blue-300 max-w-2xl mx-auto">Join our upcoming events and activities.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {% for event in events %}
            {% include 'components/event_card.html' with event=event %}
            {% endfor %}
        </div>
    </div>
</div>

{% endblock %}
